<svg class="pv__svg" viewBox="0 0 1200 410" role="img" aria-label="The proving path: three progressive verification gates — 01 RL environments, 02 Historical replay, and 03 Live decisions — connected by a closed feedback loop where every miss becomes a new environment.">
  <defs>
    <linearGradient id="pv-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f39200" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f39200" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="pv-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f39200" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f39200" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pv-loop" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f39200" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#f39200" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f39200" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <!-- Subtle architectural plate frame & coordinate ticks -->
  <g stroke="rgba(245,239,230,0.055)" stroke-width="1">
    <line x1="60" y1="74" x2="1140" y2="74"/>
    <line x1="60" y1="158" x2="1140" y2="158"/>
    <line x1="60" y1="242" x2="1140" y2="242"/>
    <line x1="60" y1="326" x2="1140" y2="326"/>
    <line x1="220" y1="36" x2="220" y2="354"/>
    <line x1="600" y1="36" x2="600" y2="354"/>
    <line x1="980" y1="36" x2="980" y2="354"/>
  </g>

  <!-- Calibrated ascending confidence trajectory connecting all three gates -->
  <path d="M84 240 L220 222 L590 178 L948 134 L1106 115" fill="none" stroke="url(#pv-beam)" stroke-width="2.2"/>
  <path d="M84 254 L220 238 L590 200 L948 156" fill="none" stroke="rgba(245,239,230,0.12)" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Closed feedback return arc: Live decisions -> RL environments -->
  <path d="M948 184 C948 354, 220 354, 220 280" fill="none" stroke="url(#pv-loop)" stroke-width="1.35" stroke-dasharray="6 5"/>
  <polygon points="220,274 215,285 225,285" fill="#f39200"/>
  <rect x="410" y="324" width="360" height="24" rx="2" fill="#120f0c" stroke="rgba(243,146,0,0.38)"/>
  <text x="590" y="340" text-anchor="middle" class="pv-mono pv-mono--am">EVERY MISS BECOMES A NEW ENVIRONMENT</text>

  <!-- ==================== GATE 01: RL ENVIRONMENTS ==================== -->
  <g transform="translate(220 222)">
    <circle r="68" fill="url(#pv-halo)"/>
    <circle r="52" fill="#120f0c" stroke="rgba(245,239,230,0.22)" stroke-width="1.1"/>
    <circle r="36" fill="none" stroke="rgba(243,146,0,0.42)" stroke-width="1" stroke-dasharray="3 4"/>
    <circle r="20" fill="none" stroke="rgba(245,239,230,0.3)" stroke-width="1"/>
    <!-- Adversarial shock probes converging on the plan -->
    <g stroke="#f39200" stroke-width="1.2" opacity="0.85">
      <line x1="-44" y1="-25" x2="-15" y2="-8"/>
      <line x1="-42" y1="26" x2="-14" y2="9"/>
      <line x1="40" y1="-28" x2="14" y2="-9"/>
    </g>
    <circle r="5.5" fill="#f39200"/>
    <line x1="0" y1="-52" x2="0" y2="-104" stroke="rgba(245,239,230,0.38)" stroke-width="1"/>
    <text x="0" y="-124" text-anchor="middle" class="pv-title"><tspan class="pv-n">01</tspan>  RL environments</text>
    <text x="0" y="-108" text-anchor="middle" class="pv-sub">FAIL SAFELY · ADVERSARIAL SEARCH</text>
  </g>

  <!-- ==================== GATE 02: HISTORICAL REPLAY ==================== -->
  <g transform="translate(590 178)">
    <circle r="68" fill="url(#pv-halo)"/>
    <circle r="52" fill="#120f0c" stroke="rgba(245,239,230,0.26)" stroke-width="1.1"/>
    <!-- Blind historical cutoff vertical line + predicted vs observed points -->
    <line x1="-6" y1="-42" x2="-6" y2="42" stroke="rgba(243,146,0,0.75)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M-36 17 L-6 5 L16 -8 L35 -17" fill="none" stroke="#f39200" stroke-width="1.8"/>
    <circle cx="16" cy="-6" r="4" fill="none" stroke="#f5efe6" stroke-width="1.4"/>
    <circle cx="35" cy="-15" r="4" fill="none" stroke="#f5efe6" stroke-width="1.4"/>
    <circle cx="-6" cy="5" r="4.5" fill="#f39200"/>
    <line x1="0" y1="-52" x2="0" y2="-86" stroke="rgba(245,239,230,0.38)" stroke-width="1"/>
    <text x="0" y="-106" text-anchor="middle" class="pv-title"><tspan class="pv-n">02</tspan>  Replay</text>
    <text x="0" y="-90" text-anchor="middle" class="pv-sub">UNSEEN HISTORY · ZERO HINDSIGHT</text>
  </g>

  <!-- ==================== GATE 03: LIVE DECISIONS ==================== -->
  <g transform="translate(948 134)">
    <circle r="76" fill="url(#pv-halo)"/>
    <circle r="52" fill="#14100b" stroke="#f39200" stroke-width="1.5"/>
    <circle r="42" fill="none" stroke="rgba(243,146,0,0.32)" stroke-width="1"/>
    <!-- Cryptographic pre-commitment seal diamond -->
    <polygon points="0,-23 23,0 0,23 -23,0" fill="rgba(243,146,0,0.14)" stroke="#f39200" stroke-width="1.5"/>
    <polygon points="0,-9 9,0 0,9 -9,0" fill="#f39200"/>
    <line x1="0" y1="-52" x2="0" y2="-66" stroke="#f39200" stroke-width="1.1"/>
    <text x="0" y="-86" text-anchor="middle" class="pv-title"><tspan class="pv-n">03</tspan>  Live decisions</text>
    <text x="0" y="-70" text-anchor="middle" class="pv-sub pv-sub--am">SEALED BEFORE OUTCOME · GRADED AFTER</text>
  </g>

  <!-- Calibrated direction ticks between gates -->
  <g fill="#f39200" opacity="0.85">
    <polygon points="410,199 400,195 401,204"/>
    <polygon points="774,155 764,151 765,160"/>
  </g>
</svg>
