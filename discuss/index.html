    <main class="main main--page" id="main">
      <section class="screen screen--discuss" data-screen>
        <p class="screen__bar"><span class="bar__squares" aria-hidden="true"><i></i><i></i></span><a class="screen__back" href="/">← foresightmachines.com</a><span class="win__lamps" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="o"></i></span></p>
        <span class="screen__corner screen__corner--tl" aria-hidden="true"></span><span class="screen__corner screen__corner--tr" aria-hidden="true"></span><span class="screen__corner screen__corner--bl" aria-hidden="true"></span><span class="screen__corner screen__corner--br" aria-hidden="true"></span>
        <div class="screen__body">
          <div class="disc">
            <div class="disc__side">
              <h1 class="h2">What decision are you facing?</h1>
              <p class="lead">Tell us what you’re weighing, what’s at stake, and what would change your mind.</p>
              <p class="disc__mail">Or write to <a data-email href="#"></a></p>
            </div>
            <div class="disc__main">
            <form class="form" data-decision-form>
              <div class="form__row">
                <label>Name
                  <input name="name" type="text" autocomplete="name" required />
                </label>
                <label>Institution
                  <input name="org" type="text" autocomplete="organization" required />
                </label>
              </div>
              <div class="form__row">
                <label>Role
                  <input name="role" type="text" autocomplete="organization-title" />
                </label>
                <label>Work email
                  <input name="reply" type="email" autocomplete="email" required />
                </label>
              </div>
              <label>The decision you want to discuss
                <textarea name="decision" required></textarea>
              </label>
              <input class="form__honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" />
              <p><button class="btn" type="submit">Discuss a decision</button></p>
            </form>
            <div class="form__done" data-form-done role="status" aria-live="polite" hidden>
              <p class="form__done-head" data-done-head>Received</p>
              <p class="form__done-lead" data-done-lead></p>
              <pre class="form__done-text" data-done-text></pre>
              <p class="form__done-actions" data-done-actions><button class="btn" type="button" data-done-copy>Copy message</button><a class="form__done-link" data-done-mail href="#">Open in mail app &rarr;</a></p>
            </div>
            </div>
          </div>
        </div>
      </section>

      <!-- @footer -->
    </main>
